[theme]
# give the backgroun black
base = "dark"
backgroundColor = "#000000"
secondaryBackgroundColor = "#000000"
textColor = "#FFFFFF"

[client]
# "minimal" hides Deploy AND the ... menu together - too broad.
# Hiding just Deploy is done via CSS in app.py instead.
# toolbarMode = "minimal"

[server]
# CloudFront's Host-header rewrite (needed for the ALB's own routing to work) means Streamlit's
# backend sees Host=<the on.aws origin> while the browser's real Origin=<the custom domain> -
# Tornado's default WebSocket check_origin() requires those to match and 403s otherwise.
# enableCORS=false makes check_origin() always return True, since a CDN sitting in front is
# an expected, legitimate setup here, not the cross-site hijack this check exists to catch.
enableCORS = false
enableXsrfProtection = false
