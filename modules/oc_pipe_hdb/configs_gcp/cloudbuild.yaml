
# sole purposes of this addtiional yaml file. 

# 1) because we are not taking dockerfile from root repo, we need to give the path to the dockerfile we are using

# 2)passing it as --cache-from lets Docker reuse that layer whenever requirements.txt is
# unchanged (see the COPY requirements.txt / RUN pip install ordering in modules/pipe_hdb/Dockerfile).
# saving time on re builds on GCP.

steps:
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - 'docker pull ${_IMAGE_TAG} || exit 0'
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-f', 'modules/pipe_hdb/Dockerfile', '--cache-from', '${_IMAGE_TAG}', '-t', '${_IMAGE_TAG}', '.']

images:
  - '${_IMAGE_TAG}'

substitutions:
  _IMAGE_TAG: 'hdb-pipeline:local'
