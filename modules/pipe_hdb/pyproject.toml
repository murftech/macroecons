[project]
name = 'pipe-hdb-sparkbricks'
version = '0.1.0'

requires-python = '==3.12.*'

# just taking latest
# dependencies = [
#     'pyspark==4.0.1',
#     'polars',
#     'requests',
#     'pandas',
#     'pyarrow',
#     'plotly',
# ]

# pinning for downward parity to data bricks | Later AWS
dependencies = [
    'pyspark[connect]==4.0.1',  # [connect] pulls in grpcio - needed for engine='sail'
    'polars',
    'requests',
    'pandas==2.2.3',
    'pyarrow==21.0.0',
    'plotly==5.24.1',
    'pysail==0.7.1',
    "sparkutils",
    'runtime_env',
    "packagesmurf",
    "lakehouse_io",
    "databricks-sdk>=0.142.0",
]

# sub: should we pull pysail to dev? Claude say depends on whether pysail can go on databricks.
[dependency-groups]

dev = [
    "ipython",
    "pytest>=9.1.1",
]

databricks = [
    'polars',
    'sparkutils',
    'runtime_env'
]
iceberg = [
    "pyiceberg[sql-sqlite]>=0.12.0",
]
delta = [
    "deltalake==1.6.5",
]

[tool.uv.sources]
# sparkutils = { path = "/Users/murftech/Dropbox/Datarepo/reusable_assets/helper_sparkutils", editable = true }
sparkutils = { git = "https://github.com/murftech/helper_sparkutils.git" }
runtime_env = { git = "https://github.com/murftech/helper_runtime_env.git" }
packagesmurf = { path = "/Users/murftech/Root/Prod/packages", editable = true }
# switch to the pushed repo with: helpers_sync.sh git lakehouse_io modules/pipe_hdb
# lakehouse_io = { git = "https://github.com/murftech/helper_lakehouse_io.git" }
lakehouse_io = { path = "/Users/murftech/Dropbox/Datarepo/reusable_assets/helper_lakehouse_io", editable = true }
